# Render Blueprint for the agent service (docs/04-architecture.md).
# Secrets are marked sync: false — Render asks for their values in the dashboard; they never live here.
services:
  - type: web
    name: memory-lane-agent
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/agent/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render has 2+ proxies in front of the service: with 1 or 2 trusted hops req.ip is still an
      # internal 10.x address (not spoofable, but rate-limit buckets are per proxy node). Pin the
      # exact chain (log raw X-Forwarded-For once) before Phase 2 adds per-IP limits.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # TEMPORARY: proxy-chain probe (remove after pinning the trust rule)
      - key: LOG_PROXY_HEADERS
        value: "1"
      # Live Qloo calls per UTC day (shared hackathon quota) and cache lifetime for user profiles.
      - key: DAILY_QLOO_CALL_BUDGET
        value: "500"
      - key: QLOO_CACHE_TTL_DAYS
        value: "7"
      # Hackathon keys only work against the hackathon API.
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
