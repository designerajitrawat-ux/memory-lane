# Render Blueprint for the agent service (docs/04-architecture.md).
# Secrets are marked sync: false — Render asks for their values in the dashboard; they never live here.
services:
  - type: web
    name: memory-lane-agent
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/agent/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Client IP for rate limits: Cloudflare (Render's edge) always overwrites cf-connecting-ip and
      # rejects requests that send it (probe 2026-10-12). Hop counting is not used: the free tier adds an
      # in-container proxy (chain: Cloudflare → Render LB → 127.0.0.1), so its length depends on the plan.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY_HOPS
        value: "0"
      # Profile limits and retention (docs/07 §2.8)
      - key: PROFILES_PER_OWNER
        value: "20"
      - key: PROFILES_PER_DAY
        value: "200"
      - key: PROFILE_RETENTION_DAYS
        value: "90"
      # Live Qloo calls per UTC day (shared hackathon quota) and cache lifetime for user profiles.
      - key: DAILY_QLOO_CALL_BUDGET
        value: "500"
      - key: QLOO_CACHE_TTL_DAYS
        value: "7"
      # Hackathon keys only work against the hackathon API.
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      # The model and the daily AI cap, kept in code so changes to them are reviewed.
      - key: LLM_MODEL
        value: gpt-6-luna
      - key: LLM_DAILY_CALLS
        value: "400"
